# --- Security (MicroProfile JWT gegen Keycloak) ---------------------------
mp.jwt.verify.publickey.location=http://127.0.0.1:8180/realms/saas/protocol/openid-connect/certs
mp.jwt.verify.issuer=http://127.0.0.1:8180/realms/saas
mp.jwt.verify.audiences=saas-api

# --- Service-zu-Service (MicroProfile Rest Client) -------------------------
# Bewusst 127.0.0.1 statt localhost: WildFly bindet standardmaessig nur an den
# IPv4-Loopback. Loest der Client "localhost" zu ::1 auf, laeuft der Aufruf ins
# Leere ("Connection refused" auf [0:0:0:0:0:0:0:1]).
# In Kubernetes hier den Service-Namen eintragen, z. B. http://tenant-service:8080
tenant-api/mp-rest/url=http://127.0.0.1:8081
tenant-api/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped
# Reicht das eingehende Bearer-Token an den Tenant-Service weiter
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization

# --- Messaging (MicroProfile Reactive Messaging / Kafka) -------------------
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.outbox-out.connector=smallrye-kafka
mp.messaging.outgoing.outbox-out.topic=order-created
mp.messaging.outgoing.outbox-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- OpenAPI ---------------------------------------------------------------
mp.openapi.extensions.smallrye.info.title=Order Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
